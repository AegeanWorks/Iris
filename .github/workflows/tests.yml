name: tests

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - name: Check out Iris
        uses: actions/checkout@v4
      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Run the unit tests
        run: node --test tests
      - name: Prove every chamber par is minimal
        run: node scripts/check-levels.mjs
      - name: Check the UI inventory
        run: node scripts/ui-inventory.mjs
      - name: Solve a chamber in a real browser
        if: matrix.node == 22
        run: node scripts/dogfood.mjs
